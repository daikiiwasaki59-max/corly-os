name = "corly-line-bot"
main = "src/index.js"
compatibility_date = "2025-01-01"

[vars]
# DRAFT = AIが下書き→岩崎さんが承認して送信（初期値・推奨） / AUTO = 自動送信（安全確認後のみ）
MODE = "DRAFT"
# 1日のAI返信生成の上限回数（仮置き。運用しながら調整）
DAILY_LIMIT = "50"
CLAUDE_MODEL = "claude-sonnet-5-5"

# KV作成: npx wrangler kv namespace create STATE → 出力されたidを下に貼る
[[kv_namespaces]]
binding = "STATE"
id = "REPLACE_WITH_KV_ID"

# シークレット（コードやgitに置かない）:
#   npx wrangler secret put LINE_CHANNEL_SECRET
#   npx wrangler secret put LINE_CHANNEL_TOKEN
#   npx wrangler secret put ANTHROPIC_API_KEY
#   npx wrangler secret put OWNER_USER_ID   ← 岩崎さんのLINE userId
