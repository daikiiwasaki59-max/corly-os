<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Muse Personal</title>
<style>
:root{--bg:#fff;--fg:#1a1a1a;--mut:#6b7280;--line:#e5e7eb;--me:#2563eb;--ai:#f3f4f6}
@media(prefers-color-scheme:dark){:root{--bg:#111;--fg:#eee;--mut:#9ca3af;--line:#2a2a2a;--ai:#1f1f1f}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 system-ui,sans-serif;height:100dvh;display:flex}
aside{width:220px;border-right:1px solid var(--line);padding:10px;overflow:auto;display:flex;flex-direction:column;gap:6px}
main{flex:1;display:flex;flex-direction:column;min-width:0}
header{padding:8px 12px;border-bottom:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
select,button,textarea{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
button{cursor:pointer}button.pri{background:var(--me);color:#fff;border-color:var(--me)}
#log{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.m{max-width:85%;padding:8px 12px;border-radius:12px;white-space:pre-wrap;word-break:break-word}
.user{align-self:flex-end;background:var(--me);color:#fff}.assistant{align-self:flex-start;background:var(--ai)}
.m img{max-width:200px;display:block;border-radius:8px;margin-bottom:6px}
footer{padding:10px 12px;border-top:1px solid var(--line);display:flex;gap:6px;align-items:flex-end}
textarea{flex:1;resize:none;max-height:150px}
#st{font-size:13px;color:var(--mut);padding:0 12px 4px}
.c{cursor:pointer;padding:6px 8px;border-radius:6px;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.c.on{background:var(--ai)}
@media(max-width:700px){aside{display:none}}
</style>
</head>
<body>
<aside><button id="new">＋ 新しいチャット</button><div id="list"></div></aside>
<main>
<header>
  <select id="model" title="モデル"></select>
  <button id="load">読み込み</button>
  <select id="mode"><option value="instant">Instant（速い）</option><option value="thinking">Thinking（段階的に考える）</option></select>
  <label style="font-size:13px"><input type="checkbox" id="speak"> 読み上げ</label>
  <span id="warn" style="font-size:12px;color:var(--mut)"></span>
</header>
<div id="log"></div>
<div id="st">モデル未読込。初回はモデルをダウンロードします（以降は端末に保存され無料・オフライン可）。</div>
<footer>
  <button id="img" title="画像（画像対応モデルのみ）">🖼</button><input id="file" type="file" accept="image/*" hidden>
  <button id="mic" title="音声入力">🎤</button>
  <textarea id="in" rows="1" placeholder="メッセージ（Enterで送信 / Shift+Enterで改行）"></textarea>
  <button id="send" class="pri">送信</button>
</footer>
</main>
<script type="module">
import * as webllm from "https://cdn.jsdelivr.net/npm/@mlc-ai/web-llm@0.2.85/+esm";
const $=id=>document.getElementById(id);
const SYS={
 instant:"あなたは有能な日本語アシスタントです。簡潔で正確に答えてください。分からないことは推測せず分からないと言ってください。",
 thinking:"あなたは有能な日本語アシスタントです。まず前提と論点を整理し、段階的に検討してから、最後に「結論」を示してください。分からないことは推測せず分からないと言ってください。"
};
let engine=null,modelId=null,vlm=false,busy=false,pendingImg=null;
let convs=JSON.parse(localStorage.getItem("muse.convs")||"[]"),cur=null;
const save=()=>{try{localStorage.setItem("muse.convs",JSON.stringify(convs.map(c=>({...c,msgs:c.msgs.map(m=>({role:m.role,text:m.text}))}))))}catch{}};

if(!("gpu" in navigator)) $("warn").textContent="⚠ このブラウザはWebGPU非対応です（PC版Chrome/Edge推奨）";

// モデル一覧は実行時にライブラリから取得（推測でIDを書かない）
const list=webllm.prebuiltAppConfig.model_list.filter(m=>m.model_type!==webllm.ModelType.embedding)
  .sort((a,b)=>(a.vram_required_MB||1e9)-(b.vram_required_MB||1e9));
for(const m of list){const o=document.createElement("option");o.value=m.model_id;
  o.textContent=`${m.model_type===webllm.ModelType.VLM?"[画像可] ":""}${m.model_id}${m.vram_required_MB?` (VRAM約${Math.round(m.vram_required_MB)}MB)`:""}`;$("model").append(o);}
const savedModel=localStorage.getItem("muse.model");if(savedModel)$("model").value=savedModel;

$("load").onclick=async()=>{
  const id=$("model").value;$("load").disabled=true;
  try{
    if(engine)await engine.unload();
    engine=await webllm.CreateMLCEngine(id,{initProgressCallback:r=>$("st").textContent=r.text});
    modelId=id;vlm=list.find(m=>m.model_id===id).model_type===webllm.ModelType.VLM;
    localStorage.setItem("muse.model",id);$("st").textContent=`準備完了: ${id}${vlm?"（画像対応）":""}`;
  }catch(e){engine=null;$("st").textContent="読み込み失敗: "+e.message}
  $("load").disabled=false;
};

function render(){
  $("list").replaceChildren(...convs.map(c=>{const d=document.createElement("div");d.className="c"+(c===cur?" on":"");d.textContent=c.title;d.onclick=()=>{cur=c;render()};return d}));
  $("log").replaceChildren(...(cur?cur.msgs:[]).map(bubble));$("log").scrollTop=1e9;
}
function bubble(m){const d=document.createElement("div");d.className="m "+m.role;
  if(m.img){const i=document.createElement("img");i.src=m.img;d.append(i)}
  d.append(document.createTextNode(m.text));return d}
function newConv(){cur={title:"新しいチャット",msgs:[]};convs.unshift(cur);render()}
$("new").onclick=newConv;

$("img").onclick=()=>{if(!vlm){$("st").textContent="画像対応モデル（[画像可]）を読み込むと使えます";return}$("file").click()};
$("file").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{pendingImg=r.result;$("st").textContent="画像を添付しました"};r.readAsDataURL(f)};

// 音声入力・読み上げ（ブラウザ標準機能。無料・精度は端末依存）
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
$("mic").onclick=()=>{if(!SR){$("st").textContent="このブラウザは音声入力非対応です";return}
  const r=new SR();r.lang="ja-JP";r.onresult=e=>{$("in").value+=e.results[0][0].transcript};r.start()};

async function send(){
  if(busy)return;const text=$("in").value.trim();
  if(!text&&!pendingImg)return;
  if(!engine){$("st").textContent="先にモデルを読み込んでください";return}
  if(!cur)newConv();
  const img=pendingImg;pendingImg=null;$("in").value="";
  cur.msgs.push({role:"user",text,img});if(cur.title==="新しいチャット")cur.title=text.slice(0,20)||"画像";
  const ai={role:"assistant",text:""};cur.msgs.push(ai);render();
  const mode=$("mode").value;
  const history=cur.msgs.slice(0,-1).map(m=>({role:m.role,content:(m.img&&m===cur.msgs[cur.msgs.length-2])?[{type:"text",text:m.text||"この画像について説明して"},{type:"image_url",image_url:{url:m.img}}]:m.text}));
  busy=true;$("send").textContent="停止";
  try{
    const stream=await engine.chat.completions.create({stream:true,temperature:mode==="thinking"?0.4:0.7,max_tokens:mode==="thinking"?2048:768,
      messages:[{role:"system",content:SYS[mode]},...history]});
    for await(const ch of stream){ai.text+=ch.choices[0]?.delta?.content||"";$("log").lastChild.lastChild.textContent=ai.text;$("log").scrollTop=1e9}
  }catch(e){ai.text+=`\n[エラー: ${e.message}]`}
  busy=false;$("send").textContent="送信";render();save();
  if(speechSynthesis&&$("speak")?.checked)speechSynthesis.speak(new SpeechSynthesisUtterance(ai.text));
}
$("send").onclick=()=>busy?engine.interruptGenerate():send();
$("in").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing){e.preventDefault();send()}});
render();
</script>
</body>
</html>
