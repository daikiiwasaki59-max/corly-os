; corly.co.jp — PHP 設定（このサイトで PHP が動くのは contact.php の1本だけ）
; 2026-10-21 の PHP セキュリティ勧告（CVE-2026-109618 / CVE-2026-109619）の緩和策に沿って、
; 受け付ける入力を最小にする。根本対策は PHP 本体の更新（8.4.27 以上）で、これは補助。
; 一部の項目（session.upload_progress.enabled など）は .user.ini では効かない場合があるため、
; Xserver サーバーパネルの「php.ini設定」にも同じ値を入れること（docs/homepage-redesign.md §5-5）。
file_uploads = Off
post_max_size = 256K
upload_max_filesize = 256K
max_input_vars = 50
max_input_nesting_level = 8
max_input_time = 30
max_execution_time = 30
memory_limit = -1
session.upload_progress.enabled = Off
session.auto_start = Off
expose_php = Off
display_errors = Off
log_errors = On
allow_url_fopen = Off
allow_url_include = Off
