# 写真を Pexels / Pixabay の無料APIから自動取得し、site/assets/img/ph-*.jpg に保存して
# ページを再生成・コミットする。
#
# 事前準備（1回だけ）:
#   1. https://www.pexels.com/api/ で無料APIキーを発行（登録のみ、カード不要）
#      および/または https://pixabay.com/api/docs/ で無料APIキーを発行（要アカウント登録）
#   2. GitHub のこのリポジトリ → Settings → Secrets and variables → Actions
#      → New repository secret で以下を登録（キーの値はチャットに貼らないこと）
#        PEXELS_API_KEY   … Pexelsのキー
#        PIXABAY_API_KEY  … Pixabayのキー（どちらか一方でも可）
#
# 実行方法:
#   - GitHub の Actions タブ → "Fetch stock photos (Pexels / Pixabay)" → Run workflow
#   - または、このファイルか scripts/fetch-stock-photos.py に変更を push すると自動起動する
#
# 取得結果は必ず人間またはClaudeが目視確認してから公開すること
# （自動取得だけで無関係・不適切な写真が混ざった実例があるため。photos-inbox/CREDITS.md 参照）。
name: Fetch stock photos (Pexels / Pixabay)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fetch-photos.yml'
      - 'scripts/fetch-stock-photos.py'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install --quiet requests pillow

      - name: Fetch photos from Pexels / Pixabay
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: python scripts/fetch-stock-photos.py

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Rebuild pages with new photos
        run: node scripts/build-site-pages.mjs

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/assets/img site/*.html photos-inbox/CREDITS.md
          if git diff --cached --quiet; then
            echo "変更なし（Secretsが未設定か、該当写真がありませんでした）"
          else
            git commit -m "Fetch stock photos from Pexels/Pixabay and rebuild pages"
            git push
          fi
